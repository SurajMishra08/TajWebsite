<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taj Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #fff8e1, #f5f5f5);
      font-family: 'Poppins', sans-serif;
    }
    .register-box {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .btn-gold {
      background-color: #ad8b3a;
      color: white;
      font-weight: 600;
    }
    .btn-gold:hover {
      background-color: #946f2a;
    }
  </style>
</head>
<body>
  <!-- Navbar start -->
  <div class="row text-light sticky-top bg-light">
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a href="index.html">
          <img src="img/tajlogo2.png" alt="Taj Logo" class="ms-4">
        </a>
        <div class="collapse navbar-collapse ms-4" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link ms-4" href="des.html">DESTINATIONS</a></li>
            <li class="nav-item"><a class="nav-link ms-4" href="hotels.html">HOTELS</a></li>
            <li class="nav-item"><a class="nav-link ms-4" href="dining.html">DINING</a></li>
            <li class="nav-item"><a class="nav-link ms-4" href="offer.html">OFFERS</a></li>
            <li class="nav-item"><a class="nav-link ms-4" href="index.html">HOME</a></li>
            <li class="nav-item"><a class="nav-link ms-5 ps-4" href="login.html">LOGIN / JOIN</a></li>
            <button class="btn text-light rounded-0 ms-5" style="background-color:#ad8b3a;">BOOK A STAY</button>
          </ul>
        </div>
      </div>
    </nav>
  </div>
  <!-- Navbar end -->

  <!-- Register form -->
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="register-box col-md-6 text-center">
      <h3 class="mt-3 text-uppercase fw-bold" style="color:#ad8b3a;">Create Your Account</h3>
      <form>
        <div class="row">
          <div class="col-md-6 mb-3 text-start">
            <label>First Name</label>
            <input type="text" class="form-control" placeholder="First Name">
          </div>
          <div class="col-md-6 mb-3 text-start">
            <label>Last Name</label>
            <input type="text" class="form-control" placeholder="Last Name">
          </div>
        </div>
        <div class="mb-3 text-start">
          <label>Email</label>
          <input type="email" class="form-control" placeholder="Email">
        </div>
        <div class="mb-3 text-start">
          <label>Contact Number</label>
          <input type="number" class="form-control" placeholder="Contact Number">
        </div>
        <div class="mb-3 text-start">
          <label>Password</label>
          <input type="password" class="form-control" placeholder="Password">
        </div>
        <div class="mb-3 text-start">
          <label>Confirm Password</label>
          <input type="password" class="form-control" placeholder="Confirm Password">
        </div>
        <button type="submit" class="btn btn-gold w-100 mt-3">Register</button>
      </form>
      <p class="mt-3">Already a member? <a href="login.html" style="color:#ad8b3a;">Login</a></p>
    </div>
  </div>
</body>
</html>
